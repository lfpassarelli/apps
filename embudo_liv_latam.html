<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Simplificado — LIV Latam</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F7F6FD;--surface2:#EDEAF8;
  --accent:#4B3E98;--accent2:#3A2F7A;--yellow:#FEC238;--orange:#F47432;
  --text:#1A1530;--muted:#6B6490;--border:#DDD9F5;--border2:#C8C3EA;
  --success:#2E9D57;--danger:#C0392B;
  --r:8px;--rs:6px;--sh:0 1px 4px rgba(75,62,152,.08);
  --f:'DM Sans',system-ui,sans-serif;--fh:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;}

.nav{display:flex;align-items:center;background:var(--accent);padding:0 28px;gap:4px;}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-size:16px;font-weight:700;color:#fff;padding:16px 0;letter-spacing:.04em;}
.nav-logo{height:36px;width:auto;display:block;}
.nav-sp{flex:1;}
.nav-upd{color:rgba(255,255,255,.55);font-size:10px;font-family:var(--fh);margin-right:12px;white-space:nowrap;}
.btn-up{display:flex;align-items:center;gap:7px;background:var(--yellow);color:var(--accent2);border:none;border-radius:var(--rs);padding:8px 16px;font-family:var(--fh);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;transition:all .18s;}
.btn-up:hover{background:#ffd060;}
.btn-up:disabled{opacity:.7;cursor:default;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin .8s linear infinite;}

.pg{padding:24px 28px;max-width:720px;margin:0 auto;}

/* country select */
.csel{position:relative;width:190px;}
.fsel-wrap{width:220px;}
.fsel{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);cursor:pointer;font-family:var(--f);font-size:13px;color:var(--text);outline:none;}
.fsel:hover,.fsel:focus{border-color:var(--accent);}
.csel-lbl{font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;display:block;}
.csel-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);cursor:pointer;font-family:var(--f);font-size:13px;color:var(--text);}
.csel-btn:hover{border-color:var(--accent);}
.csel-flag{width:20px;height:14px;border-radius:2px;display:block;flex-shrink:0;object-fit:cover;}
.csel-list{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);box-shadow:var(--sh);z-index:20;overflow:hidden;}
.csel-list.on{display:block;}
.csel-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;}
.csel-opt:hover{background:var(--surface);}
.chev{margin-left:auto;font-size:10px;color:var(--muted);}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 20px 20px;text-align:center;}
.gl{font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
.gsub{font-size:11px;color:var(--muted);margin-top:0;}
.gproj{font-size:10px;color:var(--muted);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px;}
.gproj-dot{width:8px;height:8px;border-radius:2px;background:var(--yellow);display:inline-block;flex-shrink:0;}

.sl{font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px;}

.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh);}
.ct{font-family:var(--fh);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;}

.frow{display:flex;align-items:center;gap:14px;height:38px;}
.ftrack{width:230px;flex-shrink:0;position:relative;height:36px;}
.fseg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.fnum{font-size:12px;font-weight:500;}
.flbl{font-size:12px;color:var(--text);white-space:nowrap;}
.flbl b{font-weight:500;}
.flbl span{color:var(--muted);}

.lrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px;}
.lrow span:nth-child(2){color:var(--muted);}
.lrow span:nth-child(3){font-weight:600;color:var(--text);width:80px;text-align:right;}
.ltot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface2);font-weight:700;color:var(--accent2);font-size:13px;border-radius:0 0 var(--rs) var(--rs);}
.ltot span:nth-child(3){width:80px;text-align:right;}

.state{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;}
.err{background:#FDECEA;border:1px solid #F5C2BC;color:var(--danger);border-radius:var(--rs);padding:12px 16px;font-size:12px;font-family:var(--fh);font-weight:600;line-height:1.6;}

@media(max-width:620px){
  .g2{grid-template-columns:1fr;}
  .ftrack{width:150px;}
  .pg{padding:16px;}
  .nav{padding:0 16px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <img class="nav-logo" src="https://lfpassarelli.github.io/apps/images/Logo_V_Corta_Blanco.png" alt="LIV">
    <span id="brandTitle">LIV Latam &middot; Simplificado</span>
  </div>
  <div class="nav-sp"></div>
  <span class="nav-upd" id="lastUpdate" style="display:none;"></span>
  <button class="btn-up" id="btnRefresh" onclick="loadData()">
    <svg id="refreshIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    <span id="refreshLabel">Actualizar</span>
  </button>
</div>

<div class="pg">
  <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;">
    <div class="csel">
      <span class="csel-lbl">País</span>
      <button class="csel-btn" id="cselBtn" onclick="toggleCsel()">
        <img class="csel-flag" id="cselFlag" src="https://flagcdn.com/mx.svg" alt="">
        <span id="cselLabel">México</span>
        <span class="chev">&#9660;</span>
      </button>
      <div class="csel-list" id="cselList">
        <div class="csel-opt" onclick="selectCountry('mx')"><img class="csel-flag" src="https://flagcdn.com/mx.svg" alt="">México</div>
        <div class="csel-opt" onclick="selectCountry('co')"><img class="csel-flag" src="https://flagcdn.com/co.svg" alt="">Colombia</div>
      </div>
    </div>
    <div class="fsel-wrap">
      <span class="csel-lbl">Campaña</span>
      <select class="fsel" id="campSelect" onchange="selectedCampaignId=this.value;loadData();">
        <option>Cargando&#8230;</option>
      </select>
    </div>
  </div>

  <div id="content">
    <div class="state">Cargando&#8230;</div>
  </div>
</div>

<script>
// ══ CONFIGURAÇÃO ════════════════════════════════════════════════════
// Cole aqui o token do webhook do Bitrix24 antes de compartilhar este
// arquivo. Recomendado: gere um webhook com permissão apenas de leitura
// de CRM (crm) — este arquivo só faz leitura, nunca grava nada.
const B24_TOKEN = 'mkz3hvex5xgvumx4';
// ════════════════════════════════════════════════════════════════════
const B24_DOMAIN = 'livlatam.bitrix24.com.br';
const B24_USER = '1';
const F_ALUMNOS = 'UF_CRM_1771160586';

const META_ALUMNOS = 12000;
const META_FACT = 540000;

const COUNTRIES = {
  mx: {
    name: 'México', flag: 'mx', categoryId: 3,
    stageMap: {
      'C3:NEW':'Contacto','C3:PREPAYMENT_INVOICE':'Reunión Agendada','C3:EXECUTING':'Diagnóstico [Virtual]',
      'C3:UC_OS0PHI':'Profundización Pedagógica','C3:FINAL_INVOICE':'Propuesta','C3:UC_29TR2U':'Aceptación Verbal',
      'C3:UC_05S53L':'A firmar','C3:WON':'Ganado','C3:LOSE':'Perdido'
    }
  },
  co: {
    name: 'Colombia', flag: 'co', categoryId: 29,
    stageMap: {
      'C29:NEW':'Contacto','C29:PREPARATION':'Reunión Agendada','C29:PREPAYMENT_INVOIC':'Diagnóstico [Virtual]',
      'C29:EXECUTING':'Profundización Pedagógica','C29:FINAL_INVOICE':'Propuesta','C29:UC_3OYMOV':'Aceptación Verbal',
      'C29:UC_44E66J':'A firmar','C29:WON':'Ganado','C29:LOSE':'Perdido'
    }
  }
};

const EO = ['Contacto','Reunión Agendada','Diagnóstico [Virtual]','Profundización Pedagógica','Propuesta','Aceptación Verbal','A firmar','Ganado'];
const EL = {'Contacto':'Contacto','Reunión Agendada':'Reunión Agendada','Diagnóstico [Virtual]':'Diagnóstico','Profundización Pedagógica':'Prof. Pedagógica','Propuesta':'Propuesta','Aceptación Verbal':'Acep. Verbal','A firmar':'A firmar','Ganado':'Ganado'};
const EC = {'Contacto':'#CECBF6','Reunión Agendada':'#AFA9EC','Diagnóstico [Virtual]':'#9088E3','Profundización Pedagógica':'#7F77DD','Propuesta':'#6961C8','Aceptación Verbal':'#534AB7','A firmar':'#3C3489','Ganado':'#2E9D57'};
const ET = {'Contacto':'#26215C','Reunión Agendada':'#26215C','Diagnóstico [Virtual]':'#fff','Profundización Pedagógica':'#fff','Propuesta':'#fff','Aceptación Verbal':'#fff','A firmar':'#fff','Ganado':'#fff'};

let currentCountry = 'mx';
let _lastUpdateText = '';

function fmt(n, d = 0) { return new Intl.NumberFormat('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n); }

function toggleCsel() { document.getElementById('cselList').classList.toggle('on'); }
function selectCountry(code) {
  currentCountry = code;
  const c = COUNTRIES[code];
  document.getElementById('cselFlag').src = 'https://flagcdn.com/' + c.flag + '.svg';
  document.getElementById('cselLabel').textContent = c.name;
  document.getElementById('cselList').classList.remove('on');
  document.getElementById('brandTitle').textContent = 'LIV Latam · ' + c.name + ' · Simplificado';
  loadData();
}
document.addEventListener('click', e => {
  const sel = document.getElementById('csel-wrap');
  if (!e.target.closest('.csel')) document.getElementById('cselList').classList.remove('on');
});

function toFormPairs(obj, prefix) {
  const pairs = [];
  function walk(v, p) {
    if (v === null || v === undefined) return;
    if (Array.isArray(v)) { v.forEach((x, i) => walk(x, p + '[' + i + ']')); }
    else if (typeof v === 'object') { Object.entries(v).forEach(([k, x]) => walk(x, p ? p + '[' + k + ']' : k)); }
    else { pairs.push(encodeURIComponent(p) + '=' + encodeURIComponent(v)); }
  }
  walk(obj, prefix || '');
  return pairs.join('&');
}
async function b24call(method, params) {
  const url = 'https://' + B24_DOMAIN + '/rest/' + B24_USER + '/' + B24_TOKEN + '/' + method + '.json';
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: toFormPairs(params || {}) });
  const json = await res.json();
  if (json.error) throw new Error((json.error_description || json.error) + ' (' + method + ')');
  return json;
}
const F_CAMPANA = 'UF_CRM_1790878606';
let selectedCampaignId = '';
let _campaignReady = false;

function itemsOf(fields, code) { const f = fields && fields[code]; const m = []; ((f && f.items) || []).forEach(it => { m.push({ id: it.ID, value: it.VALUE }); }); return m; }

async function initCampaignFilter() {
  const sel = document.getElementById('campSelect');
  try {
    const df = (await b24call('crm.deal.fields', {})).result;
    const items = itemsOf(df, F_CAMPANA);
    if (!items.length) { sel.innerHTML = '<option value="">Todas</option>'; _campaignReady = true; return; }
    let def = items.find(it => /27\s*[-\u2010-\u2015]\s*28/.test(it.value));
    selectedCampaignId = def ? def.id : items[0].id;
    sel.innerHTML = items.map(it => `<option value="${it.id}" ${it.id === selectedCampaignId ? 'selected' : ''}>${it.value}</option>`).join('');
  } catch (err) {
    sel.innerHTML = '<option value="">Todas</option>';
    console.warn('No se pudo cargar el filtro de Campaña:', err.message);
  }
  _campaignReady = true;
}

async function fetchAllDeals(categoryId, campaignId) {
  let start = 0, all = [];
  const select = ['ID', 'STAGE_ID', 'OPPORTUNITY', F_ALUMNOS];
  const filter = { CATEGORY_ID: categoryId };
  if (campaignId) filter[F_CAMPANA] = campaignId;
  while (true) {
    const r = await b24call('crm.deal.list', { filter, select, start });
    all = all.concat(r.result);
    if (r.next === undefined || r.next === null) break;
    start = r.next;
  }
  return all;
}

function setLoading(on) {
  const btn = document.getElementById('btnRefresh');
  const icon = document.getElementById('refreshIcon');
  const label = document.getElementById('refreshLabel');
  const upd = document.getElementById('lastUpdate');
  if (btn) btn.disabled = on;
  if (icon) icon.classList.toggle('spin', on);
  if (label) label.textContent = on ? 'Actualizando...' : 'Actualizar';
  if (upd) {
    if (on) { upd.style.display = 'inline'; upd.textContent = 'Actualizando datos\u2026'; }
    else if (_lastUpdateText) { upd.style.display = 'inline'; upd.textContent = _lastUpdateText; }
    else { upd.style.display = 'none'; }
  }
}

async function loadData() {
  if (!B24_TOKEN || B24_TOKEN === 'COLE_SEU_TOKEN_AQUI') {
    document.getElementById('content').innerHTML = '<div class="err">Configure o token do webhook antes de usar este arquivo: procure por <code>B24_TOKEN</code> no início do bloco &lt;script&gt; e cole o token do seu webhook Bitrix24 no lugar de <code>COLE_SEU_TOKEN_AQUI</code>.</div>';
    return;
  }
  setLoading(true);
  try {
    if (!_campaignReady) await initCampaignFilter();
    const cfg = COUNTRIES[currentCountry];
    const deals = await fetchAllDeals(cfg.categoryId, selectedCampaignId);
    const rows = deals.map(d => ({
      _e: cfg.stageMap[d.STAGE_ID] || d.STAGE_ID,
      _al: Number(d[F_ALUMNOS]) || 0,
      _tot: Number(d.OPPORTUNITY) || 0
    }));
    render(rows);
    _lastUpdateText = 'Actualizado ' + new Date().toLocaleString('es-MX', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
  } catch (err) {
    document.getElementById('content').innerHTML = '<div class="err">Error al cargar: ' + err.message + '</div>';
  } finally {
    setLoading(false);
  }
}

function buildGaugeSVG(actual, meta, projected) {
  const arcMax = meta * 1.25;
  const R = 90, cx = 110, cy = 110;
  const L = Math.PI * R;
  const tAct = Math.min(actual / arcMax, 1);
  const tProj = Math.min(Math.max(projected, actual) / arcMax, 1);
  const tMeta = 1 / 1.25;
  const rad = deg => deg * Math.PI / 180;
  const ptAt = (t, r) => { const a = 180 * (1 - t); return [cx + r * Math.cos(rad(a)), cy - r * Math.sin(rad(a))]; };
  const [ix, iy] = ptAt(tMeta, R - 12);
  const [ox, oy] = ptAt(tMeta, R + 12);
  const pctAct = Math.round(actual / meta * 100);
  const colorAct = actual >= meta ? '#2E9D57' : '#4B3E98';
  const colorProj = '#FEC238';
  const offAct = (L * (1 - tAct)).toFixed(1);
  const offProj = (L * (1 - tProj)).toFixed(1);
  return `<svg viewBox="0 0 220 120" style="width:100%;max-width:220px;">
    <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="rgba(75,62,152,.12)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="${colorProj}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${offProj}"/>
    <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="${colorAct}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${offAct}"/>
    <line x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="98" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-size="26" font-weight="500" fill="#1A1530">${pctAct}%</text>
  </svg>`;
}

function render(rows) {
  const eCnt = {}, eAl = {}, eTot = {};
  rows.forEach(r => {
    if (!EO.includes(r._e)) return;
    eCnt[r._e] = (eCnt[r._e] || 0) + 1;
    eAl[r._e] = (eAl[r._e] || 0) + r._al;
    eTot[r._e] = (eTot[r._e] || 0) + r._tot;
  });
  EO.forEach(e => { eCnt[e] = eCnt[e] || 0; eAl[e] = eAl[e] || 0; eTot[e] = eTot[e] || 0; });

  const tAl = eAl['Ganado'], tFact = eTot['Ganado'];
  const projAl = tAl + eAl['A firmar'];
  const projFact = tFact + eTot['A firmar'];
  const pctProjAl = Math.round(projAl / META_ALUMNOS * 100);
  const pctProjFa = Math.round(projFact / META_FACT * 100);

  const maxCount = Math.max(...EO.map(e => eCnt[e]), 1);
  const boundaries = EO.map(e => eCnt[e]).concat(eCnt[EO[EO.length - 1]]);
  function insetPct(c) { return ((1 - c / maxCount) / 2 * 100).toFixed(2); }

  const funnelHtml = EO.map((e, i) => {
    const topIn = insetPct(boundaries[i]);
    const botIn = insetPct(boundaries[i + 1]);
    const clip = `polygon(${topIn}% 0%, ${100 - topIn}% 0%, ${100 - botIn}% 100%, ${botIn}% 100%)`;
    return `<div class="frow">
      <div class="ftrack">
        <div class="fseg" style="background:${EC[e]};clip-path:${clip};">
          <span class="fnum" style="color:${ET[e]};">${fmt(eCnt[e])}</span>
        </div>
      </div>
      <div class="flbl"><b>${EL[e]}</b><span> — ${fmt(Math.round(eAl[e]))} alumnos · $${fmt(Math.round(eTot[e] / 1000))}k</span></div>
    </div>`;
  }).join('');

  const totalAl = EO.reduce((s, e) => s + eAl[e], 0);
  const totalVal = EO.reduce((s, e) => s + eTot[e], 0);
  const listHtml = EO.map(e => `<div class="lrow"><span>${EL[e]}</span><span>${fmt(Math.round(eAl[e]))} alumnos</span><span>$${fmt(Math.round(eTot[e] / 1000))}k</span></div>`).join('')
    + `<div class="ltot"><span>Total</span><span>${fmt(Math.round(totalAl))} alumnos</span><span>$${fmt(Math.round(totalVal / 1000))}k</span></div>`;

  document.getElementById('content').innerHTML = `
    <div class="g2">
      <div class="gcard">
        <div class="gl">Meta de alumnos</div>
        ${buildGaugeSVG(tAl, META_ALUMNOS, projAl)}
        <div class="gsub">${fmt(Math.round(tAl))} / ${fmt(META_ALUMNOS)} alumnos (Ganado)</div>
        <div class="gproj"><span class="gproj-dot"></span>Proyectado (+A firmar): ${fmt(Math.round(projAl))} · ${pctProjAl}%</div>
      </div>
      <div class="gcard">
        <div class="gl">Meta financiera</div>
        ${buildGaugeSVG(tFact, META_FACT, projFact)}
        <div class="gsub">US$ ${fmt(Math.round(tFact / 1000))}k / US$ ${fmt(Math.round(META_FACT / 1000))}k (Ganado)</div>
        <div class="gproj"><span class="gproj-dot"></span>Proyectado (+A firmar): $${fmt(Math.round(projFact / 1000))}k · ${pctProjFa}%</div>
      </div>
    </div>
    <div class="sl">Embudo de negocios por etapa</div>
    <div class="card">${funnelHtml}</div>
    <div class="sl">Valor y alumnos por etapa</div>
    <div class="card" style="padding:0;">${listHtml}</div>
  `;
}

loadData();
</script>
</body>
</html>
